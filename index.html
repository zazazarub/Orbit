<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbita">
<title>Orbita</title>
<script>
(function(){
 var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#4E8BFF"/></linearGradient></defs><circle cx="32" cy="32" r="14" fill="url(#g)"/><ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="url(#g)" stroke-width="3.2" transform="rotate(-25 32 32)" opacity=".9"/><circle cx="53" cy="21" r="4.2" fill="#fff" stroke="#4E8BFF" stroke-width="1.5"/></svg>';
 window.LOGO='data:image/svg+xml,'+encodeURIComponent(svg);
 var l=document.createElement('link');l.rel='icon';l.href=window.LOGO;document.head.appendChild(l);
 var t=null;try{t=localStorage.getItem('orbita_theme')}catch(e){}
 if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
 document.documentElement.dataset.theme=t;
 var m=document.createElement('meta');m.name='theme-color';m.content=t==='dark'?'#0B0F17':'#F7FAFF';document.head.appendChild(m);
})();
</script>
<style>
:root{
 --bg:#F7FAFF;--surface:rgba(255,255,255,.62);--surface-2:rgba(255,255,255,.94);--card:rgba(234,242,255,.82);
 --border:rgba(150,185,235,.42);--acc:#4E8BFF;--acc-2:#6aa2ff;--acc-soft:rgba(78,139,255,.14);
 --text:#1F2937;--mute:#64748B;
 --in:rgba(255,255,255,.94);--in-t:#1F2937;--out:linear-gradient(135deg,#d9e8ff,#bfd9ff);--out-t:#0f2a52;
 --tick:#7f9cc9;--tick-r:#2f6fe8;--hdr:rgba(255,255,255,.60);--hover:rgba(78,139,255,.08);
 --shadow:0 12px 40px rgba(70,110,180,.14);--shadow-s:0 2px 8px rgba(70,110,180,.10);
 --danger:#e5484d;--ok:#22c55e;--blur:blur(20px) saturate(150%);--scrim:rgba(24,44,84,.30);
 --blob1:rgba(120,170,255,.40);--blob2:rgba(190,175,255,.30);--blob3:rgba(130,205,255,.32);
 color-scheme:light;
}
:root[data-theme=dark]{
 --bg:#0B0F17;--surface:rgba(20,30,46,.62);--surface-2:rgba(24,34,52,.96);--card:rgba(34,48,70,.70);
 --border:rgba(120,160,220,.20);--acc:#7FB3FF;--acc-2:#5f9bf2;--acc-soft:rgba(127,179,255,.16);
 --text:#EAF2FF;--mute:#A0AEC0;
 --in:rgba(38,52,76,.90);--in-t:#EAF2FF;--out:linear-gradient(135deg,#40739f,#335f94);--out-t:#fff;
 --tick:rgba(255,255,255,.60);--tick-r:#a8d4ff;--hdr:rgba(16,24,38,.58);--hover:rgba(127,179,255,.09);
 --shadow:0 12px 40px rgba(0,0,0,.45);--shadow-s:0 2px 8px rgba(0,0,0,.30);
 --danger:#ff7a85;--scrim:rgba(0,0,0,.55);
 --blob1:rgba(60,110,200,.32);--blob2:rgba(95,75,195,.24);--blob3:rgba(40,125,190,.24);
 color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
html{background:var(--bg);height:100%}
body{height:100%;color:var(--text);font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;letter-spacing:-.005em;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(55% 45% at 12% 8%,var(--blob1),transparent 70%),radial-gradient(45% 40% at 92% 18%,var(--blob2),transparent 70%),radial-gradient(60% 50% at 75% 100%,var(--blob3),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;outline:0;width:100%;min-width:0}
input::placeholder{color:var(--mute);opacity:.85}
.hidden{display:none!important}
.grow{flex:1}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.mute,.sub{color:var(--mute);font-size:13px}
.err{color:var(--danger);min-height:20px;margin:6px 2px;font-size:14px}

/* ---------- buttons & fields ---------- */
.primary{background:linear-gradient(135deg,var(--acc-2),var(--acc));color:#fff;padding:12px 20px;border-radius:16px;font-weight:600;box-shadow:0 6px 18px rgba(78,139,255,.32)}
:root[data-theme=dark] .primary{color:#0b1830}
.primary:active{transform:scale(.985)}
.primary[disabled]{opacity:.6}
.ghost{background:var(--card);border:1px solid var(--border);padding:11px 18px;border-radius:16px}
.ghost.danger{color:var(--danger)}
.link{color:var(--acc);padding:8px 6px}
.link[disabled]{color:var(--mute)}
.fld{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:0 14px;height:48px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.fld:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld svg{color:var(--mute)}
.ib{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--mute);transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.solid{background:var(--card);border:1px solid var(--border);color:var(--text)}

/* ---------- avatars ---------- */
.avw{position:relative;display:inline-block;flex:none}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(40,70,130,.18)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pd{position:absolute;right:0;bottom:0;width:26%;height:26%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface-2)}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
#abox{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:30px 24px 22px;box-shadow:var(--shadow);text-align:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.logo img{width:84px;height:84px;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 16px rgba(78,139,255,.35))}
#abox h1{font-size:25px;font-weight:700;margin-bottom:4px}
.sub2{color:var(--mute);margin-bottom:20px;font-size:14.5px}
.sub2 b{color:var(--text);font-weight:600}
#abox .primary{width:100%;margin-top:4px}
.alinks{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.codein input{text-align:center;font-size:28px;letter-spacing:10px;font-weight:600;padding-left:10px}
.codein{height:60px}
.hint{color:var(--mute);font-size:12.5px;text-align:left;margin:-4px 4px 10px}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;height:var(--app-h,100dvh);display:grid;grid-template-columns:392px 1fr;gap:14px;padding:14px}
.side,.conv{min-height:0;min-width:0;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.side{display:flex;flex-direction:column}
.shead{flex:none;padding:16px 14px 6px}
.srow{display:flex;align-items:center;gap:6px}
.srow h2{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-left:6px}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:0 12px;height:44px;margin:10px 2px 0}
.srch svg{color:var(--mute);width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:14px}
.chip.on{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(78,139,255,.34)}
:root[data-theme=dark] .chip.on{color:#0b1830}
.list{flex:1;overflow:auto;padding:4px 8px 12px}
.sect{padding:12px 12px 4px;color:var(--mute);font-size:13px;font-weight:600}
.item{display:flex;gap:12px;padding:10px;border-radius:20px;cursor:pointer;align-items:center;transition:background .12s}
.item:hover{background:var(--hover)}
.item.on{background:var(--acc-soft)}
.meta{flex:1;min-width:0}
.l1,.l2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.l2{margin-top:2px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.nm svg.i{width:15px;height:15px;color:var(--mute);stroke-width:2}
.tm{color:var(--mute);font-size:12px;flex:none;display:flex;align-items:center;gap:3px}
.pv{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.typ{color:var(--acc)!important}
.bdg{background:var(--acc);color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 7px;font-size:12.5px;font-weight:600;display:grid;place-items:center;flex:none}
:root[data-theme=dark] .bdg{color:#0b1830}
.tk{display:inline-flex;color:var(--tick)}.tk.r{color:var(--tick-r)}
.tk svg.i{width:16px;height:16px;stroke-width:2}
.empty{color:var(--mute);text-align:center;padding:48px 28px;font-size:14.5px}

/* ---------- conversation ---------- */
.conv{--hh:64px;--ch:72px}
.head{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--hdr);border-bottom:1px solid var(--border);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.hl{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0;flex:1}
.hl .nm{font-size:16.5px}
.hs{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs.on{color:var(--acc)}.hs.typ{color:var(--acc)}
.back{display:none}
.msgs{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--hh) + 14px) 16px calc(var(--ch) + 12px);display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.day{align-self:center;background:var(--card);border:1px solid var(--border);color:var(--mute);font-size:12px;padding:3px 13px;border-radius:99px;margin:10px 0 6px}
.b{max-width:min(560px,80%);padding:8px 13px 6px;border-radius:20px;overflow-wrap:anywhere;white-space:pre-wrap;position:relative;-webkit-touch-callout:none;line-height:1.38}
.b.in{background:var(--in);color:var(--in-t);align-self:flex-start;border-bottom-left-radius:7px;border:1px solid var(--border);box-shadow:var(--shadow-s)}
.b.out{background:var(--out);color:var(--out-t);align-self:flex-end;border-bottom-right-radius:7px;box-shadow:var(--shadow-s)}
.b.del{opacity:.6;font-style:italic}
.b.pend{opacity:.75}
.mt{float:right;margin:8px 0 0 12px;font-size:11px;opacity:.8;display:inline-flex;gap:3px;align-items:center;white-space:nowrap;line-height:1}
.b.out .tk{color:var(--tick)}.b.out .tk.r{color:var(--tick-r)}
.sn{font-size:13px;font-weight:600;margin-bottom:1px}
.b.media{padding:4px 4px 6px;white-space:normal}
.b.media .mt{display:flex;float:none;justify-content:flex-end;margin:3px 8px 0}
.pic{display:block;max-width:100%;max-height:360px;min-width:140px;min-height:90px;border-radius:16px;cursor:zoom-in;background:var(--card);object-fit:cover}
.circ{width:210px;height:210px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;background:var(--card);box-shadow:0 0 0 3px var(--acc-soft)}
.circ video{width:100%;height:100%;object-fit:cover;display:block}
.cd{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.circ.on .cd{display:none}
.vp{display:flex;align-items:center;gap:10px;min-width:230px;white-space:normal;padding:2px 0}
.pl{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;flex:none;display:grid;place-items:center}
:root[data-theme=dark] .pl{color:#0b1830}
.pl svg.i{width:18px;height:18px}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:30px;cursor:pointer}
.wv i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.28}
.wv i.p{opacity:.95;color:var(--acc)}
.vt{font-size:12px;opacity:.8;min-width:32px;text-align:right}
.fl{display:flex;gap:12px;align-items:center;cursor:pointer;white-space:normal;min-width:190px;padding:2px}
.fic{width:42px;height:42px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.fn{font-weight:600;word-break:break-all}.fs{font-size:12px;opacity:.7}

#compwrap{position:absolute;z-index:3;left:0;right:0;bottom:0}
.comp{display:flex;gap:6px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--hdr);border-top:1px solid var(--border);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);min-height:68px}
.comp.ro{justify-content:center;color:var(--mute);font-size:14px}
.field{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:0 16px;height:44px;min-width:0;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.send{background:linear-gradient(135deg,var(--acc-2),var(--acc));width:44px;height:44px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(78,139,255,.35)}
:root[data-theme=dark] .send{color:#0b1830}
.send svg.i{width:20px;height:20px}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:0 14px;height:44px}
.dot{width:10px;height:10px;border-radius:50%;background:#ff3b50;animation:bl 1s infinite;display:inline-block;flex:none}
@keyframes bl{50%{opacity:.25}}
.ph{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center;height:100%;padding:20px}
.ph span{background:var(--card);border:1px solid var(--border);padding:7px 16px;border-radius:99px;font-size:14px}
.conv .ph{position:absolute;inset:0}

/* ---------- popups ---------- */
.pop{position:fixed;z-index:30;min-width:250px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:8px;box-shadow:var(--shadow)}
.pop .pr{display:flex;gap:12px;align-items:center;padding:8px 10px;cursor:pointer;border-radius:14px}
.pop .pr:hover,.pop button.mi:hover{background:var(--hover)}
.pop button.mi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:14px}
.pop button.mi svg.i{color:var(--mute);width:20px;height:20px}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.seg{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:3px;margin:4px 6px}
.seg button{flex:1;padding:7px 4px;border-radius:11px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button svg.i{width:16px;height:16px}
.seg button.on{background:var(--surface-2);box-shadow:var(--shadow-s);color:var(--acc)}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:40;padding:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mbox{background:var(--surface-2);border:1px solid var(--border);border-radius:28px;padding:22px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.mbox h3{margin-bottom:14px;text-align:center;font-size:18px}
.mbox label{display:block;color:var(--mute);font-size:12.5px;margin:12px 4px 5px}
.mbox .fld{margin-bottom:0}
.mbox .bio{margin:10px 0;color:var(--text);white-space:pre-wrap;opacity:.9}
.ctr{text-align:center}.ctr .avw{margin:0 auto 8px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.avbtn{position:relative;width:96px;margin:0 auto 6px;cursor:pointer}
.avbtn .cam{position:absolute;right:-4px;bottom:-4px;background:var(--acc);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;border:3px solid var(--surface-2)}
.avbtn .cam svg.i{width:16px;height:16px}
.lk{display:flex;gap:8px}.lk .fld{flex:1}
.lk button{background:var(--acc);padding:0 14px;border-radius:14px;color:#fff;flex:none;font-size:14px}
:root[data-theme=dark] .lk button{color:#0b1830}
.mlist{max-height:240px;overflow:auto}
.mr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:8px}
.mrl{display:flex;gap:10px;align-items:center;min-width:0}
.mact{display:flex}.mact button{padding:7px;color:var(--mute);border-radius:10px}.mact button:hover{background:var(--hover);color:var(--text)}
.mact svg.i{width:18px;height:18px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:500}
.crec{text-align:center}
.cwrap{width:min(280px,68vw);height:min(280px,68vw);border-radius:50%;overflow:hidden;margin:0 auto 14px;background:#000;box-shadow:0 0 0 4px #ff3b50}
.cwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ctimer{display:flex;gap:8px;justify-content:center;align-items:center}
.lb{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;cursor:zoom-out;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb img{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);box-shadow:var(--shadow);padding:10px 18px;border-radius:99px;z-index:60;max-width:90vw;text-align:center;font-size:14px}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 :root{--hdr:rgba(255,255,255,.92)}:root[data-theme=dark]{--hdr:rgba(16,24,38,.94)}
}
@media(max-width:760px){
 #app{grid-template-columns:1fr;padding:0;gap:0}
 .side,.conv{border-radius:0;border:0;box-shadow:none;background:transparent}
 .conv{display:none}
 #app.open .side{display:none}#app.open .conv{display:block}
 .back{display:grid}
 .b{max-width:88%}
 .list{padding:2px 6px 12px}
 .shead{padding-top:calc(14px + env(safe-area-inset-top))}
 .head{padding-top:calc(9px + env(safe-area-inset-top))}
 .toast{bottom:110px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="auth"><div id="abox"></div></div>

<div id="app" class="hidden">
 <div class="side">
  <div class="shead">
   <div class="srow">
    <button class="ib" id="me_btn" title="Профиль и настройки"></button>
    <h2>Чаты</h2><span class="grow"></span>
    <button class="ib solid" id="s_tg" title="Поиск"></button>
    <button class="ib solid" id="s_new" title="Новый чат"></button>
   </div>
   <div class="srch hidden" id="s_box"><span id="s_ic"></span><input id="q" placeholder="Поиск людей, групп и каналов" autocomplete="off" autocapitalize="off"></div>
   <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
 </div>
 <div class="conv" id="conv"></div>
</div>
<div class="pop hidden" id="pop"></div>
<div class="modal hidden" id="modal"></div>
<div class="lb hidden" id="lb"></div>
<div class="toast hidden" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- icons ---------- */
const P={

const dt=ts=>{const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()?hm(ts):d.toLocaleDateString('ru',{day:'numeric',month:'short'})};
function dayLabel(ts){const d=new Date(ts),n=new Date(),y=new Date();y.setDate(n.getDate()-1);
 if(d.toDateString()===n.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';
 return d.toLocaleDateString('ru',{day:'numeric',month:'long',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined})}
const sep=(prev,m)=>(!prev||new Date(prev.ts).toDateString()!==new Date(m.ts).toDateString())?'<div class="day">'+dayLabel(m.ts)+'</div>':'';
const fmtDur=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtSize=b=>b<1024?b+' Б':b<1048576?Math.round(b/1024)+' КБ':(b/1048576).toFixed(1)+' МБ';
const plural=(n,f)=>{const a=n%10,b=n%100;return a===1&&b!==11?f[0]:(a>=2&&a<=4&&(b<10||b>=20))?f[1]:f[2]};

 size=size||52;const name=String(o.title||o.name||'?');const key=o.id||o.username||name;const h=hue(key);

async function api(p,body){
 const r=await fetch('/api/'+p,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...authH()},body:body===undefined?undefined:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){
  if(r.status===401&&token&&!/^(login|register|auth\/|password\/)/.test(p)){localStorage.removeItem('orbita_token');location.reload()}
  const e=new Error(j.error||'Ошибка');e.status=r.status;throw e;
 }
 return j;
}
async function upload(blob,kind,name,dur){
 const r=await fetch('/api/upload?kind='+kind+'&dur='+(dur||0)+'&name='+encodeURIComponent(name||'file'),{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream',...authH()},body:blob});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||'Не удалось загрузить файл');
 return j.media;
}
const mcache=new Map();
function mediaURL(id){
 if(!mcache.has(id))mcache.set(id,fetch('/api/media/'+id,{headers:authH()}).then(r=>{if(!r.ok)throw new Error('media');return r.blob()}).then(b=>URL.createObjectURL(b)).catch(e=>{mcache.delete(id);throw e}));
 return mcache.get(id);
}

/* ============ REALTIME ============ */
function connect(){
 if(es)es.close();
 es=new EventSource('/api/stream?token='+encodeURIComponent(token));
 es.onopen=()=>{if(firstOpen){firstOpen=false;return}loadChats();refreshCur()};
 es.addEventListener('msg',e=>onMsg(JSON.parse(e.data)));
 es.addEventListener('del',e=>{const d=JSON.parse(e.data);markDeleted(d.conv,d.id);loadChats()});
 es.addEventListener('conv',async e=>{
  const d=JSON.parse(e.data);loadChats();
  if(cur&&cur.id===d.id){try{cur=Object.assign(cur,(await api('chats/info?conv='+encodeURIComponent(d.id))).chat);renderHead();renderComp()}catch(x){}}
 });
 es.addEventListener('gone',e=>{const d=JSON.parse(e.data);if(cur&&cur.id===d.conv){closeChat();closeModal()}loadChats()});
 es.addEventListener('presence',e=>{
  const d=JSON.parse(e.data);
  chats.forEach(c=>{if(c.type==='dm'&&c.peerId===d.id)c.presence={online:d.online,seen:d.seen}});
  if(cur&&cur.type==='dm'&&cur.peerId===d.id){cur.presence={online:d.online,seen:d.seen};updateStatus();$('hd')&&renderHead()}
  if(!$('q').value.trim())drawList();
 });
 es.addEventListener('typing',e=>{
  const d=JSON.parse(e.data);
  let m=typing.get(d.conv);if(!m){m=new Map();typing.set(d.conv,m)}
  const old=m.get(d.from);if(old)clearTimeout(old.t);
  const t=setTimeout(()=>{m.delete(d.from);typingChanged(d.conv)},5000);
  m.set(d.from,{name:d.name,a:d.a,t});typingChanged(d.conv);
 });
 es.addEventListener('read',e=>{
  const d=JSON.parse(e.data);
  if(cur&&cur.id===d.conv){peerRead=Math.max(peerRead,d.upTo);updateTicks()}
  loadChats();
 });
}
function typingChanged(convId){updateStatus(convId);if(!$('q').value.trim())drawList()}
function typingText(convId,dm){
 const m=typing.get(convId);if(!m||!m.size)return '';
 const arr=[...m.values()];const act=a=>a==='voice'?'записывает голосовое':a==='circle'?'записывает видео':'печатает';
 if(dm)return act(arr[0].a)+'…';
 if(arr.length===1)return arr[0].name+' '+act(arr[0].a)+'…';
 if(arr.length===2)return arr[0].name+' и '+arr[1].name+' печатают…';
 return arr.length+' человека печатают…';
}
function statusOf(c){
 if(c.type!=='dm')return{t:(c.members||0)+' '+plural(c.members||0,c.type==='channel'?PL_SUB:PL_MEM),cls:''};
 const ty=typingText(c.id,true);if(ty)return{t:ty,cls:'typ'};
 const p=c.presence;if(p&&p.online)return{t:'в сети',cls:'on'};
 const M={recently:'был(а) недавно',week:'был(а) на этой неделе',month:'был(а) в этом месяце',long:'был(а) давно'};
 return{t:M[p&&p.seen]||'был(а) давно',cls:''};
}
function updateStatus(convId){
 if(!cur||(convId&&convId!==cur.id))return;
 const el=$('hs');if(!el)return;
 let s=statusOf(cur);
 if(cur.type!=='dm'){const ty=typingText(cur.id,false);if(ty)s={t:ty,cls:'typ'}}
 el.textContent=s.t;el.className='hs '+s.cls;
}
function onMsg(m){
 const mine=m.from===me.id;
 const tm=typing.get(m.conv);if(tm&&tm.has(m.from)){clearTimeout(tm.get(m.from).t);tm.delete(m.from);updateStatus(m.conv)}
 if(cur&&cur.id===m.conv){
  if(!msgs.some(x=>x.id===m.id)){const prev=msgs[msgs.length-1];msgs.push(m);appendMsg(m,prev)}
  if(!mine&&!document.hidden)api('read',{conv:m.conv}).then(loadChats).catch(()=>{});
 }
 loadChats();
 if(!mine&&(!cur||cur.id!==m.conv||document.hidden))notify(m);
}
function notify(m){
 if(window.Notification&&Notification.permission==='granted'){
  const c=chats.find(x=>x.id===m.conv);
  try{new Notification((c?c.title:'Orbita')+(m.u&&c&&c.type==='group'?' · '+m.u.name:''),{body:labelOf(m)})}catch(e){}
 }
}
async function refreshCur(){
 if(!cur)return;
 try{const j=await api('messages?conv='+encodeURIComponent(cur.id));cur=Object.assign(cur,j.chat);msgs=j.messages;peerRead=j.peerRead||0;drawMsgs();renderHead();renderComp()}catch(e){}
}
function markDeleted(conv,id){
 if(!cur||cur.id!==conv)return;
 const m=msgs.find(x=>x.id===id);if(!m||m.deleted)return;
 m.deleted=true;m.text='';m.media=null;drawMsgs(true);
}

 l.innerHTML=shown.map(c=>{

async function shrink(file,max,quality,square){
 const bmp=await createImageBitmap(file);
 let w=bmp.width,h=bmp.height,sx=0,sy=0,sw=w,sh=h;
 if(square){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=s;sh=s;w=h=Math.min(max,s)}
 else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 cv.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,w,h);
 return new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('toBlob')),'image/jpeg',quality));
}
async function attach(file){

 else if(file.type.startsWith('image/')){try{blob=await shrink(file,1600,0.85);kind='image'}catch(e){blob=file;kind='file'}}
 sendMedia(cur.id,blob,kind,file.name||'file',0);
}

/* ---------- voice & circle recording ---------- */
const AUDIO_MIMES=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
const VIDEO_MIMES=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
const pickMime=l=>(window.MediaRecorder&&l.find(t=>MediaRecorder.isTypeSupported(t)))||'';
async function startRec(kind){
 if(R||!cur)return;
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Запись не поддерживается в этом браузере');
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(kind==='voice'?{audio:true}:{audio:true,video:{facingMode:'user',width:{ideal:480},height:{ideal:480}}})}
 catch(e){return toast('Нет доступа к '+(kind==='voice'?'микрофону':'камере или микрофону')+'. Разрешите доступ в настройках браузера.')}
 const mime=pickMime(kind==='voice'?AUDIO_MIMES:VIDEO_MIMES);
 const opts=Object.assign(mime?{mimeType:mime}:{},kind==='circle'?{videoBitsPerSecond:700000,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000});
 let rec;
 try{rec=new MediaRecorder(stream,opts)}catch(e){stream.getTracks().forEach(t=>t.stop());return toast('Не удалось начать запись')}
 const r=R={rec,stream,chunks:[],start:Date.now(),kind,cancel:false,iv:null,ty:null,conv:cur.id};
 rec.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data)};
 rec.onstop=()=>finishRec(r);
 if(kind==='voice'){
  $('compwrap').innerHTML='<div class="comp"><button class="ib" id="rc" title="Отмена">'+IC.trash+'</button><div class="recbar"><span class="dot"></span><span id="rt">0:00</span><span class="mute">идёт запись…</span></div><button class="send" id="rs">'+IC.send+'</button></div>';
 }else{
  modal('<div class="crec"><div class="cwrap"><video id="cv" muted playsinline autoplay></video></div><div class="ctimer"><span class="dot"></span><span id="rt">0:00</span></div><div class="mrow" style="justify-content:center"><button class="ghost" id="rc">Отмена</button><button class="primary" id="rs">Отправить</button></div></div>');
  const v=$('cv');v.srcObject=stream;v.play().catch(()=>{});
 }
 $('rc').onclick=()=>stopRec(false);
 $('rs').onclick=()=>stopRec(true);
 rec.start(500);
 const ping=()=>api('typing',{conv:r.conv,a:kind}).catch(()=>{});ping();r.ty=setInterval(ping,3000);
 r.iv=setInterval(()=>{const s=Math.round((Date.now()-r.start)/1000);const t=$('rt');if(t)t.textContent=fmtDur(s);if(s>=(kind==='voice'?300:60))stopRec(true)},250);
}
function stopRec(send){
 const r=R;if(!r)return;
 r.cancel=!send;
 try{if(r.rec.state!=='inactive')r.rec.stop();else finishRec(r)}catch(e){finishRec(r)}
}
async function finishRec(r){
 if(r.done)return;r.done=true;
 if(R===r)R=null;
 clearInterval(r.iv);clearInterval(r.ty);r.stream.getTracks().forEach(t=>t.stop());
 if(r.kind==='circle')closeModal();
 renderComp();
 if(r.cancel)return;
 const dur=Math.round((Date.now()-r.start)/1000);
 if(dur<1||!r.chunks.length)return toast('Слишком короткая запись');
 const type=(r.rec.mimeType||r.chunks[0].type||'').split(';')[0]||(r.kind==='voice'?'audio/webm':'video/webm');
 const blob=new Blob(r.chunks,{type});
 sendMedia(r.conv,blob,r.kind,(r.kind==='voice'?'voice.':'circle.')+(type.split('/')[1]||'bin'),dur);
}

$('s_new').onclick=e=>{
 e.stopPropagation();
 const p=showPop('<button class="mi" id="n_f">'+IC.search+'Найти человека</button><button class="mi" id="n_g">'+IC.users+'Новая группа</button><button class="mi" id="n_c">'+IC.mega+'Новый канал</button>',e.currentTarget,true);
 p.onclick=ev=>ev.stopPropagation();
 $('n_f').onclick=()=>{p.classList.add('hidden');$('s_box').classList.remove('hidden');$('q').focus()};
 $('n_g').onclick=()=>{p.classList.add('hidden');newChatModal('group')};
 $('n_c').onclick=()=>{p.classList.add('hidden');newChatModal('channel')};
};
const fldHTML=(id,ph,val,extra)=>'<div class="fld"><input id="'+id+'" placeholder="'+ph+'" value="'+esc(val||'')+'" '+(extra||'')+'></div>';
function profileModal(){
 let newAv;
 modal('<h3>Профиль</h3><div class="ctr"><div class="avbtn" id="pa">'+av(me,96)+'<span class="cam">'+IC.camera+'</span></div></div>'
  +'<label>Почта (видна только вам)</label><div class="fld" style="opacity:.75">'+IC.mail+'<input value="'+esc(me.email||'')+'" readonly></div>'
  +'<label>Имя</label>'+fldHTML('p_n','Имя',me.name,'maxlength="40"')
  +'<label>Юзернейм</label>'+fldHTML('p_u','юзернейм',me.username,'autocapitalize="off" maxlength="32"')
  +'<label>О себе</label>'+fldHTML('p_b','Пара слов о себе',me.bio,'maxlength="200"')
  +'<div class="err" id="p_e"></div><div class="mrow"><button class="ghost" id="p_c">Отмена</button><button class="primary" id="p_s">Сохранить</button></div>');
 $('pa').onclick=()=>pickAvatar((mm,url)=>{newAv=mm.id;$('pa').innerHTML='<span class="avw" style="width:96px;height:96px"><span class="av"><img src="'+url+'" alt=""></span></span><span class="cam">'+IC.camera+'</span>'});
 $('p_c').onclick=closeModal;
 $('p_s').onclick=async()=>{
  try{
   const body={name:$('p_n').value,username:$('p_u').value,bio:$('p_b').value};
   if(newAv!==undefined)body.avatar=newAv;
   me=(await api('profile',body)).user;closeModal();renderMe();loadChats();toast('Профиль сохранён');
  }catch(e){$('p_e').textContent=e.message}
 };
}
function newChatModal(type){
 const ch=type==='channel';
 modal('<h3>'+(ch?'Новый канал':'Новая группа')+'</h3>'+fldHTML('n_t','Название','','maxlength="60"')
  +'<label>Описание (необязательно)</label>'+fldHTML('n_b','О чём '+(ch?'канал':'группа'),'','maxlength="200"')
  +'<label>Публичный @юзернейм (необязательно)</label>'+fldHTML('n_u','например, my_'+(ch?'channel':'group'),'','autocapitalize="off" maxlength="32"')
  +'<div class="mute" style="margin:6px 4px 0">Если оставить пустым, '+(ch?'канал':'группа')+' будет частным: вход только по ссылке-приглашению.</div>'
  +(ch?'':'<label>Участники (через запятую)</label>'+fldHTML('n_m','@друг1, @друг2','','autocapitalize="off"'))
  +'<div class="err" id="n_e"></div><div class="mrow"><button class="ghost" id="n_c">Отмена</button><button class="primary" id="n_o">Создать</button></div>');
 $('n_c').onclick=closeModal;
 $('n_o').onclick=async()=>{
  try{
   const body={type,title:$('n_t').value,bio:$('n_b').value,username:$('n_u').value};
   if(!ch)body.members=($('n_m').value||'').split(/[,\s]+/).filter(Boolean);
   const j=await api('chats/create',body);
   closeModal();await loadChats();await openChat(j.chat);infoModal();
  }catch(e){$('n_e').textContent=e.message}
 };
}
function editChatModal(){
 const c=cur;let newAv;
 modal('<h3>Редактировать</h3><div class="ctr"><div class="avbtn" id="pa">'+av(c,96)+'<span class="cam">'+IC.camera+'</span></div></div>'
  +'<label>Название</label>'+fldHTML('e_t','Название',c.title,'maxlength="60"')
  +'<label>Описание</label>'+fldHTML('e_b','Описание',c.bio,'maxlength="200"')
  +'<label>Публичный @юзернейм (пусто = только по ссылке)</label>'+fldHTML('e_u','юзернейм',c.username,'autocapitalize="off" maxlength="32"')
  +'<div class="err" id="e_e"></div><div class="mrow"><button class="ghost" id="e_c">Отмена</button><button class="primary" id="e_s">Сохранить</button></div>');
 $('pa').onclick=()=>pickAvatar((mm,url)=>{newAv=mm.id;$('pa').innerHTML='<span class="avw" style="width:96px;height:96px"><span class="av"><img src="'+url+'" alt=""></span></span><span class="cam">'+IC.camera+'</span>'});
 $('e_c').onclick=closeModal;
 $('e_s').onclick=async()=>{
  try{
   const body={conv:c.id,title:$('e_t').value,bio:$('e_b').value,username:$('e_u').value};
   if(newAv!==undefined)body.avatar=newAv;
   const j=await api('chats/update',body);
   if(cur&&cur.id===c.id){cur=Object.assign(cur,j.chat);renderHead()}
   closeModal();loadChats();
  }catch(e){$('e_e').textContent=e.message}
 };
}
async function infoModal(){
 const c=cur;if(!c)return;
 if(c.type==='dm'){
  const st=statusOf(c);
  modal('<div class="ctr">'+av(c,96,c.presence&&c.presence.online)+'<h3 style="margin-bottom:2px">'+esc(c.title)+'</h3><div class="sub">@'+esc(c.username)+' · '+st.t+'</div></div>'+(c.bio?'<p class="bio">'+esc(c.bio)+'</p>':'')+'<div class="mrow"><button class="primary" id="x">Закрыть</button></div>');
  $('x').onclick=closeModal;return;
 }
 let list=[],total=c.members;
 try{const j=await api('chats/members?conv='+encodeURIComponent(c.id));list=j.members;total=j.total}catch(e){}
 const admin=c.role==='owner'||c.role==='admin',owner=c.role==='owner';
 const pubLink=c.username?location.origin+'/#c='+c.username:'';
 const invLink=c.invite?location.origin+'/#j='+c.invite:'';
 const lk=v=>'<div class="lk"><div class="fld"><input readonly value="'+esc(v)+'"></div><button data-act="cp" data-v="'+esc(v)+'">Копировать</button></div>';
 const rows=list.map(u=>'<div class="mr"><div class="mrl">'+av(u,38)+'<div style="min-width:0"><div class="nm">'+esc(u.name)+(u.role==='owner'?' <span class="badge">владелец</span>':u.role==='admin'?' <span class="badge">админ</span>':'')+'</div><div class="sub">@'+esc(u.username)+'</div></div></div>'+((admin&&u.role!=='owner'&&u.id!==me.id)?'<div class="mact">'+(owner?'<button data-act="adm" data-u="'+esc(u.username)+'" data-v="'+(u.role==='admin'?0:1)+'" title="Администратор">'+IC.star+'</button>':'')+'<button data-act="rm" data-u="'+esc(u.username)+'" title="Удалить">'+IC.close+'</button></div>':'')+'</div>').join('');
 const bx=modal('<div class="ctr">'+av(c,96)+'<h3 style="margin-bottom:2px">'+esc(c.title)+'</h3><div class="sub">'+(c.type==='channel'?'Канал':'Группа')+' · '+total+' '+plural(total,c.type==='channel'?PL_SUB:PL_MEM)+'</div></div>'
  +(c.bio?'<p class="bio">'+esc(c.bio)+'</p>':'')
  +(pubLink?'<label>Публичная ссылка</label>'+lk(pubLink):'')
  +(invLink?'<label>Ссылка-приглашение</label>'+lk(invLink)+(admin?'<button class="link" data-act="reset">Сбросить ссылку</button>':''):'')
  +((admin&&c.type==='group')?'<label>Добавить участника</label><div class="lk"><div class="fld"><input id="ad_u" placeholder="@юзернейм" autocapitalize="off"></div><button data-act="add">Добавить</button></div>':'')
  +'<label>'+((c.type==='channel'&&!admin)?'Администраторы':'Участники')+'</label><div class="mlist">'+rows+'</div><div class="err" id="i_e"></div>'
  +'<div class="mrow">'+(admin?'<button class="ghost" data-act="edit">Редактировать</button>':'')+'<button class="ghost danger" data-act="leave">Покинуть</button>'+(owner?'<button class="ghost danger" data-act="del">Удалить</button>':'')+'<button class="primary" data-act="close">Закрыть</button></div>');
 bx.onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,u=b.dataset.u;
  try{
   if(act==='close')closeModal();
   else if(act==='cp'){try{await navigator.clipboard.writeText(b.dataset.v);toast('Скопировано')}catch(x){const i=b.parentNode.querySelector('input');i.select();toast('Ссылка выделена, скопируйте её')}}
   else if(act==='reset'){cur=Object.assign(cur,(await api('chats/invite/reset',{conv:c.id})).chat);infoModal()}
   else if(act==='add'){await api('chats/add',{conv:c.id,username:$('ad_u').value});infoModal()}
   else if(act==='adm'){await api('chats/admin',{conv:c.id,username:u,admin:b.dataset.v==='1'});infoModal()}
   else if(act==='rm'){if(confirm('Удалить @'+u+' из чата?')){await api('chats/remove',{conv:c.id,username:u});infoModal()}}
   else if(act==='edit')editChatModal();
   else if(act==='leave'){if(confirm('Покинуть «'+c.title+'»?')){await api('chats/leave',{conv:c.id});closeModal();closeChat();loadChats()}}
   else if(act==='del'){if(confirm('Удалить «'+c.title+'» навсегда вместе со всеми сообщениями?')){await api('chats/delete',{conv:c.id});closeModal();closeChat();loadChats()}}
  }catch(x){const er=$('i_e');if(er)er.textContent=x.message}
 };
}
async function joinModal(q){
 let j;
 try{j=await api('join/preview?'+(q.invite?'invite='+encodeURIComponent(q.invite):'handle='+encodeURIComponent(q.handle)))}catch(e){return toast(e.message)}
 const c=j.chat;
 if(j.joined){await loadChats();return openChat(chats.find(x=>x.id===c.id)||c)}
 modal('<div class="ctr">'+av(c,96)+'<h3 style="margin-bottom:2px">'+esc(c.title)+'</h3><div class="sub">'+(c.type==='channel'?'Канал':'Группа')+' · '+c.members+' '+plural(c.members,c.type==='channel'?PL_SUB:PL_MEM)+'</div></div>'+(c.bio?'<p class="bio">'+esc(c.bio)+'</p>':'')+'<div class="mrow"><button class="ghost" id="j_c">Отмена</button><button class="primary" id="j_o">'+(c.type==='channel'?'Подписаться':'Вступить')+'</button></div>');
 $('j_c').onclick=closeModal;
 $('j_o').onclick=async()=>{try{const r=await api('join',q);closeModal();await loadChats();openChat(r.chat)}catch(e){toast(e.message)}};
}
function handleHash(){
 const h=location.hash.replace(/^#/,'');if(!h)return;
 const i=h.indexOf('=');if(i<0)return;
 const k=h.slice(0,i),v=decodeURIComponent(h.slice(i+1));
 history.replaceState(null,'',location.pathname+location.search);
 if(!v)return;
 if(k==='j')joinModal({invite:v});else if(k==='c')joinModal({handle:v});else if(k==='u')openUser(v);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur&&me)api('read',{conv:cur.id}).then(loadChats).catch(()=>{})});

boot();
</script>
</body>
</html>
